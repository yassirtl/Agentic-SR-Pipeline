[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-pipeline"
version = "0.1.0"
description = "Multi-agent LangGraph pipeline for PRISMA 2020 systematic reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph~=1.2",
    "langchain-core~=1.7",
    "langchain-openai~=1.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv~=1.2",
    "httpx~=0.28",
    # Part 5: deduplication, full text, RAG
    "rapidfuzz~=3.14",
    "pypdf~=7.0",
    "numpy~=2.4",
    "faiss-cpu~=1.10.0",  # 1.11+ ships no Intel Mac (x86_64) wheel
    "rank-bm25~=0.2.2",
    "snowballstemmer~=3.0",  # BM25 word stems (pure Python)
    "openai~=3.46",       # embeddings (also installed by langchain-openai)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [  # raised inside faiss's SWIG bindings, not by this project
    "ignore::DeprecationWarning:faiss.loader",
    "ignore:builtin type [Ss]wig:DeprecationWarning",
]
