[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-pipeline"
version = "0.1.0"
description = "Multi-agent LangGraph pipeline for PRISMA 2020 systematic reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph~=1.2",
    "langchain-core~=1.7",
    "langchain-openai~=1.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv~=1.2",
    "httpx~=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
