# Evaluation topics (docs/PLAN.md §4b). Each run must use the same question, designs and
# search window as the gold-standard review, so recall is measured on equal terms.
# `years` goes into the protocol template (years.start / years.end_date).
# `--topic T1|T2|T3` (search_smoke, screen_smoke; CLI in Part 9) seeds the protocol with
# question, study_designs, years, languages and inclusion/exclusion_criteria from here
# (sr_pipeline.evaluation.topics), replacing the Planner's draft; criteria_source says so
# at approval. Seen in Part 6: the Planner wrote "aged 65 or older" for T3, whose review
# used "over 60", and that criterion alone drove most exclusions.
# T1 / T2 criteria: to copy from the papers before their runs (Part 10); until then
# their runs keep the Planner's criteria.

T1:
  question: How accurate are smartwatches at detecting cardiac arrhythmias?
  review: Nazarian 2021, J Med Internet Res 23(8):e28974, PMC8433941
  gold: gold/T1.csv
  study_designs: []
  years: {start: null, end_date: 2021-02-28}
  search_date_source: '"All articles published until February 2021" (month only: last day used)'
  their_databases: [Embase, MEDLINE, Cochrane Library]

T2:
  question: How accurate are large language models at automated title and abstract screening for systematic reviews?
  review: Kim 2025, J Med Artif Intell 8:34, doi 10.21037/jmai-24-408
  gold: gold/T2.csv
  study_designs: []
  years: {start: null, end_date: 2024-08-31}
  search_date_source: 'Methods "In July 2024", abstract "August 2024", no day: end of August used'
  their_databases: [MEDLINE, Embase, Scopus]

T3:
  question: Does exercise reduce depressive symptoms in older adults?
  review: Li 2024, Front Psychol 15:1484172, PMC11427357
  gold: gold/T3.csv
  study_designs: [randomized controlled trial]
  # Part 8: direction of effect (GDS, BDI, PHQ-9: a lower score = fewer symptoms).
  outcome_directions: {depressive symptoms: lower}
  years: {start: null, end_date: 2024-01-07}
  search_date_source: '"from establishing the database to January 7, 2024"'
  their_databases: [Cochrane Library, Web of Science, PubMed, Embase, CNKI, Wanfang]
  # Li 2024, section 2.2 (abridged). Part 6c: `stage: full_text` = an abstract can never
  # show it (never decides at title/abstract); `test` = the positive sentence the screeners
  # judge (the review's wording stays the one displayed). Reading of the review's criteria,
  # from its question and Table 1: depressive symptoms are the OUTCOME, so depression is
  # not a "comorbidity"; "interventions beyond exercise" concerns the exercise-vs-control
  # pair used (multi-arm trials, Cochrane Handbook), not extra arms of the trial.
  # `label` (Part 9b): short exclusion reason shown in the PRISMA diagram (display only).
  inclusion_criteria:
    - {text: Randomized controlled trial, label: not an RCT}
    - {text: Healthy older adults aged over 60 years, label: not healthy adults over 60}
    - text: No significant baseline difference between experimental and control groups
      stage: full_text
      label: groups differ at baseline
    - text: Intervention is physical exercise; the control group does no regular exercise
      label: not exercise vs no exercise
    - text: Depression measured with GDS, GDS-15, SCL-90, SGDS-K, TDQ or TGDS
      label: other depression scale
    - text: Data reported as mean and standard deviation
      stage: full_text
      label: no mean and SD
  exclusion_criteria:
    - text: Older adults with comorbidities or below 60 years of age
      label: comorbidities or under 60
      test: >-
        Participants have a disease or condition other than depression or depressive
        symptoms (e.g. dementia, Alzheimer's disease, stroke, cancer, intellectual
        disability), or include people younger than 60. Depression or depressive symptoms
        are this review's outcome, never a comorbidity.
    - text: Interventions beyond exercise
      label: non-exercise components
      test: >-
        In the comparison judged, the exercise arm also receives a non-exercise component
        that the control arm does not (e.g. exercise plus diet or supplements, exercise plus
        cognitive training). Other arms of the trial do not count.
    - text: Incomplete data or no control group
      label: incomplete data or no control
      test: >-
        The study has no control arm (e.g. a single-group pre-post study), or reports
        incomplete outcome data.
  languages: [English, Chinese]
  note: >-
    Table 1 lists 15 articles; the text also says 13 articles / 18 studies. Gold = the 15
    rows of Table 1. 5 of them are from 2005-2014: the default template window (last 5
    years, Part 9b) would exclude them, so years.start must be null (a topic's years
    replace the template's, so `recent` does not apply). Development question of Parts 4-5 (gold list
    first opened in Part 6). Their own gold list departs from their criteria (Makizako:
    exercise vs horticulture arms; Shahidi: laughter yoga vs exercise), so criteria-exact
    screening may exclude a few gold studies: count them separately in Part 10.
