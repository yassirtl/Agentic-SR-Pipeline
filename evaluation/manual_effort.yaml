# Manual effort model for the "time savings" criterion (Part 10, sr_pipeline.evaluation).
#
# manual hours = sum(minutes per item x this run's counts) / 60 + fixed hours
#   title_abstract, full_text: per record and per reviewer (x reviewers: dual screening)
#   extraction, risk_of_bias: per included study (one reviewer + checking folded in)
# Counts come from the run (records screened, full texts sought, studies included).
#
# Every rate is left empty on purpose: the evaluation computes NO manual estimate until
# all of them are filled with values whose source is stated below (no guessed numbers).
# Candidate source: Haddaway NR, Westgate MJ. Predicting the time needed for
# environmental systematic reviews and systematic maps. Conserv Biol 2019;33(2):434-443
# (PredicTER tool, defaults per stage; check the units in the paper before using them).
source: ""            # e.g. "Haddaway & Westgate 2019, Table 2"
reviewers: 2
minutes_per_item:
  title_abstract: null
  full_text: null
  extraction: null
  risk_of_bias: null
fixed_hours:          # protocol, search design, synthesis, writing (null = not counted)
  protocol: null
  search: null
  synthesis_and_writing: null

# Shown next to the run time as context (whole review, not per task):
benchmark: "Haddaway & Westgate 2019: an average environmental systematic review takes about 164 full-time-equivalent days (66 CEE reviews, 2012-2017)."
