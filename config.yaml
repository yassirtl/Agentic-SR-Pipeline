# Run configuration. Environment variables override these values (see src/sr_pipeline/config.py).
# Never put API keys here: put them in the git-ignored .env file at the project root
# (OPENAI_API_KEY=..., optional NCBI_API_KEY=..., OPENALEX_API_KEY=...).

default_model: gpt-4o-mini
models:              # per-agent model; agents not listed use default_model
  planner: gpt-4o-mini
  coordinator: gpt-4o-mini
  # extraction: gpt-4o
  # synthesis: gpt-4o

max_records: 500     # per database
max_steps: 40        # coordinator step budget

# Search refinement (search_strategy stage): hit counts are checked before any
# download; the LLM narrows / broadens the query at most max_refinements times.
broad_factor: 5      # too broad if hits > broad_factor x max_records (5 x 500 = 2500)
min_hits: 20         # too narrow if hits < min_hits
max_refinements: 2

# Optional: an e-mail sent to OpenAlex (polite pool) and NCBI so they can contact
# you instead of blocking you. Better set it in .env as SR_CONTACT_EMAIL.
contact_email: null

# Relative paths are resolved under the project root.
cache_dir: .cache/llm
http_cache_dir: .cache/http   # recorded database answers (searches are re-run from here)
runs_dir: runs
protocol_template: protocols/template.yaml
