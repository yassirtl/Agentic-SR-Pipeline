# Run configuration. Environment variables override these values (see src/sr_pipeline/config.py).
# Never put API keys here: put them in the git-ignored .env file at the project root
# (OPENAI_API_KEY=..., optional NCBI_API_KEY=..., OPENALEX_API_KEY=...).

default_model: gpt-4o-mini
models:              # per-agent model; agents not listed use default_model
  planner: gpt-4o-mini
  coordinator: gpt-4o-mini
  # screener_a: gpt-4o-mini   # strict screener
  # screener_b: gpt-4o-mini   # lenient screener
  # adjudicator: gpt-4o       # third reviewer on disagreements
  # extraction: gpt-4o
  # risk_of_bias: gpt-4o
  # synthesis: gpt-4o

max_records: 3000    # per database: download ceiling; more hits = "not retrieved" in PRISMA
max_steps: 40        # coordinator step budget

# Search refinement (search_strategy stage): hit counts are checked before any
# download; the LLM narrows / broadens the query at most max_refinements times.
# A database is in range when min_hits <= hits <= max_records.
min_hits: 20         # too narrow if hits < min_hits
max_refinements: 2

# Optional: an e-mail sent to OpenAlex (polite pool) and NCBI so they can contact
# you instead of blocking you. Better set it in .env as SR_CONTACT_EMAIL.
contact_email: null

# RAG over full texts (Part 5): section-aware chunks of ~chunk_words words with
# chunk_overlap words of overlap; OpenAI embeddings (cached on disk) + BM25,
# fused by rank; the LLM re-ranker scores the rerank_top best passages.
embedding_model: text-embedding-3-small
chunk_words: 250
chunk_overlap: 40
rerank_top: 20

# Screening (Part 6): dual screening (strict A + lenient B), adjudicator on
# disagreement. Records are screened in screening_workers threads. Full text:
# ft_candidates passages per (paper, criterion) are re-ranked, the screeners
# read the best ft_passages.
screening_workers: 8
ft_candidates: 10
ft_passages: 5
ft_rerank: true      # re-rank each criterion's passages with the LLM (about half the full-text cost)
# Extraction + risk of bias (Part 7) reuse ft_candidates / ft_passages / ft_rerank and
# screening_workers; models: 'extraction' and 'risk_of_bias' agents (see models above).

# Relative paths are resolved under the project root.
cache_dir: .cache/llm
http_cache_dir: .cache/http   # recorded database answers (searches are re-run from here)
embedding_cache: .cache/embeddings.sqlite
runs_dir: runs
protocol_template: protocols/template.yaml
