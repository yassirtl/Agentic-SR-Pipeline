# PRISMA 2020 protocol template.
#
# Scope (applied as is, the Planner never changes it):
#   years, languages, direction_metric_order, and databases when given as a list.
# databases: auto lets the Planner choose (openalex always, pubmed for health,
# arxiv for quantitative fields), with a one-line reason you see at approval.
# Hints (optional): anything you fill in below is given to the Planner, which
# drafts the rest from the research question. You approve or edit the final
# protocol before the search starts (skipped with --auto).

# --- Scope ------------------------------------------------------------------
databases: auto      # or a list, e.g. [openalex, pubmed, arxiv]
years:
  recent: 5          # last 5 years: start = end year (or this year) - 5
  # start: 2015      # explicit first publication year (wins over recent);
                     # start: null = no lower limit (recent is then ignored)
  end: null          # last publication year (null = up to now)
  end_date: null     # optional exact last date, YYYY-MM-DD (e.g. a review's search date)
languages: [English]
# Result that gives each study's direction of effect in the synthesis, first available
# wins (pre-specified here, not chosen after seeing the results):
direction_metric_order: [between_group_estimate, post_means, change_means]

# --- Hints for the Planner (leave empty to let it decide) -------------------
pico:
  population: ""     # who is studied
  intervention: ""   # intervention / exposure / method
  comparator: ""     # comparison (a control for effect questions)
  outcomes: []       # extra outcomes to add to the ones the question names
study_designs: []    # e.g. [randomized controlled trial, cohort study]
inclusion_criteria: []
exclusion_criteria: []
